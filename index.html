<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1억 만들기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="static/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:        '#0e8c63',
            'primary-strong':'#0a5f44',
            'primary-tint': '#eafaf3',
            accent:         '#e0a93c',
            'accent-strong':'#b07d12',
            positive:       '#2563eb',
          }
        }
      }
    }
  </script>
</head>
<body>

<!-- ambient field -->
<div class="ambient" aria-hidden="true">
  <div class="blob blob-gold"></div>
  <div class="blob blob-emerald"></div>
  <div class="blob blob-cool"></div>
</div>

<!-- ── 로딩 화면 ── -->
<div id="loading-screen" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
  <img src="static/logo.png" alt="로고" class="w-16 h-16 rounded-2xl mb-5">
  <svg class="w-7 h-7 animate-spin text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
  </svg>
</div>

<!-- ── 로그인 화면 ── -->
<div id="auth-screen">
  <img src="static/logo.png" alt="로고" class="logo">
  <h1 class="text-2xl font-extrabold text-slate-800 mb-1 tracking-tight">1억 만들기</h1>
  <p class="text-sm mb-8" style="color:var(--on-surface-v)">주간 저축 목표 달성 트래커</p>

  <div class="w-full max-w-sm space-y-3">
    <div class="field">
      <label>이메일</label>
      <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="auth-signup-extra" class="hidden space-y-3">
      <div class="field">
        <label>비밀번호 확인</label>
        <input id="auth-password-confirm" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="field">
        <label>아이디 (단축어용 sender 이름)</label>
        <input id="auth-username" type="text" placeholder="예: 민혁">
      </div>
    </div>
    <p id="auth-error" class="text-xs text-red-500 hidden"></p>
    <button id="auth-submit" class="btn-primary" onclick="handleAuth()">로그인</button>
    <div class="flex items-center justify-center gap-3 pt-1">
      <button class="btn-ghost text-sm" onclick="toggleMode()">
        <span id="toggle-label">회원가입</span>
      </button>
      <span style="color:var(--outline)">|</span>
      <button class="btn-ghost text-sm" onclick="forgotPassword()">비밀번호 찾기</button>
    </div>
    <p id="auth-info" class="text-xs text-center hidden" style="color:var(--primary)"></p>
  </div>
</div>

<!-- ── 대시보드 ── -->
<div id="dashboard" class="hidden pb-32" style="position:relative;z-index:10">

  <!-- 헤더 -->
  <div class="app-header px-4 pb-5 pt-safe">
    <!-- 최종 목표 라벨 + 설정 -->
    <div class="flex items-center justify-between pt-2 mb-1">
      <span class="text-xs text-white/70">⊙ 최종 목표</span>
      <a href="setup.html" class="text-white/60 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </a>
    </div>

    <!-- 잔액 크게 + 달성률 -->
    <div class="flex items-end justify-between mb-2">
      <div>
        <span id="header-current" class="header-amount">—</span>
        <span id="header-goal" class="header-amount-sub"> / —</span>
      </div>
      <span id="header-rate" class="header-rate-badge">—%</span>
    </div>

    <!-- 진행 바 -->
    <div class="progress-track h-1.5 mb-3">
      <div id="final-bar" class="progress-bar bar-final" style="width:0%"></div>
    </div>

    <!-- 주간 네비 -->
    <div class="flex items-center justify-between">
      <button onclick="prevWeek()" class="p-2 rounded-full hover:bg-white/20 active:bg-white/30 transition text-white/80">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="text-center">
        <p id="week-range" class="text-sm font-bold text-white"></p>
        <p id="week-label-text" class="text-xs text-white/65 mt-0.5"></p>
      </div>
      <button id="next-week-btn" onclick="nextWeek()" class="p-2 rounded-full hover:bg-white/20 active:bg-white/30 transition text-white/80">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 컨텐츠 -->
  <div class="px-4 -mt-2 space-y-3">

    <!-- D+/D- + 누적 예정 저축액 -->
    <div id="progress-card" class="card hidden">
      <div class="flex items-center justify-between mb-3">
        <div class="text-center flex-1">
          <p class="text-xs mb-1" style="color:var(--on-surface-v)">시작한 지</p>
          <p id="d-plus" class="display-md" style="color:var(--on-surface)">D+0</p>
        </div>
        <div class="w-px h-14" style="background:var(--outline)"></div>
        <div class="text-center flex-1">
          <p class="text-xs mb-1" style="color:var(--on-surface-v)">목표까지</p>
          <p id="d-minus" class="display-md" style="color:var(--on-surface)">D-0</p>
        </div>
      </div>
      <div class="pt-3" style="border-top:1px solid var(--outline)">
        <p class="text-xs mb-1" style="color:var(--on-surface-v)">오늘까지 누적 예정 대비</p>
        <p id="cumulative-diff" class="text-base font-extrabold" style="font-feature-settings:'tnum'">—</p>
        <p id="cumulative-sub" class="text-xs mt-0.5" style="color:var(--on-surface-m);font-feature-settings:'tnum'"></p>
      </div>
    </div>

    <!-- 잔액 불일치 경고 -->
    <div id="balance-warn" class="hidden banner banner-warn">
      <span class="text-xl">⚠️</span>
      <div>
        <p class="text-xs font-bold" style="color:var(--warning)">잔액 불일치 감지</p>
        <p class="text-xs" style="color:var(--warning)">미확인 내역을 확인해주세요.</p>
      </div>
    </div>

    <!-- 주간 저축 카드 (링) -->
    <div class="card card-hero">
      <div class="flex items-center gap-4">
        <!-- 원형 링 -->
        <div class="flex-shrink-0">
          <svg id="week-ring-svg" viewBox="0 0 100 100" width="96" height="96">
            <circle cx="50" cy="50" r="42" fill="none" stroke="var(--outline)" stroke-width="11"/>
            <circle id="week-ring-arc" cx="50" cy="50" r="42" fill="none"
              stroke="var(--primary)" stroke-width="11" stroke-linecap="round"
              stroke-dasharray="263.9 263.9" stroke-dashoffset="263.9"
              transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .7s ease,stroke .4s"/>
            <text id="week-ring-pct" x="50" y="47" text-anchor="middle"
              font-family="Pretendard,-apple-system,sans-serif"
              font-size="19" font-weight="800" fill="var(--on-surface)" letter-spacing="-0.5">0%</text>
            <text x="50" y="61" text-anchor="middle"
              font-family="Pretendard,-apple-system,sans-serif"
              font-size="10" font-weight="500" fill="var(--on-surface-m)">달성률</text>
          </svg>
        </div>
        <!-- 저축 수치 -->
        <div class="flex-1 min-w-0">
          <p class="text-xs mb-1" style="color:var(--on-surface-v)">이번 주 저축</p>
          <p id="week-savings" class="text-2xl font-extrabold tracking-tight leading-tight"
             style="font-feature-settings:'tnum';color:var(--primary)">0원</p>
          <p id="week-goal-text" class="text-xs mt-1"
             style="color:var(--on-surface-m);font-feature-settings:'tnum'">주간 목표 0원</p>
        </div>
      </div>
      <div class="flex items-center gap-3 mt-3 pt-3" style="border-top:1px solid rgba(0,0,0,.06)">
        <span class="text-xs" style="color:var(--on-surface-m)">● 수입</span>
        <span id="week-income" class="text-xs font-semibold" style="color:var(--success);font-feature-settings:'tnum'">+0원</span>
        <span style="color:var(--outline)">|</span>
        <span class="text-xs" style="color:var(--on-surface-m)">● 지출</span>
        <span id="week-expense" class="text-xs font-semibold" style="color:var(--error);font-feature-settings:'tnum'">-0원</span>
      </div>
    </div>

    <!-- 일일 힌트 -->
    <div id="hint-card" class="hidden"></div>

    <!-- 수행건수 카드 -->
    <div class="card space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold" style="color:var(--on-surface)">수행건수</h2>
        <button onclick="savePerformance()" class="text-xs font-semibold px-3 py-1 rounded-lg" style="background:var(--primary-tint);color:var(--primary-strong)">저장</button>
      </div>
      <div class="stepper">
        <button class="stepper-btn" onclick="stepPerf(-1)">−</button>
        <span id="perf-count" class="stepper-val">0</span>
        <button class="stepper-btn" onclick="stepPerf(1)">+</button>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center pt-1">
        <div>
          <p class="text-xs mb-0.5" style="color:var(--on-surface-m)">이번 주</p>
          <p id="perf-week" class="text-sm font-extrabold" style="color:var(--on-surface)">—</p>
        </div>
        <div>
          <p class="text-xs mb-0.5" style="color:var(--on-surface-m)">이번 달</p>
          <p id="perf-month" class="text-sm font-extrabold" style="color:var(--on-surface)">—</p>
        </div>
        <div>
          <p class="text-xs mb-0.5" style="color:var(--on-surface-m)">올해</p>
          <p id="perf-year" class="text-sm font-extrabold" style="color:var(--on-surface)">—</p>
        </div>
        <div>
          <p class="text-xs mb-0.5" style="color:var(--on-surface-m)">누적</p>
          <p id="perf-total" class="text-sm font-extrabold" style="color:var(--on-surface)">—</p>
        </div>
      </div>
    </div>

    <!-- 뜻밖의 큰지출 -->
    <div class="card overflow-hidden !p-0">
      <div class="px-4 pt-4 pb-2 flex items-center justify-between" style="border-bottom:1px solid rgba(0,0,0,.06)">
        <h2 class="text-sm font-bold" style="color:var(--on-surface)">뜻밖의 큰지출</h2>
      </div>
      <div class="px-4 py-3">
        <button class="expense-trigger" onclick="openExpense()">＋ 큰 지출 입력</button>
      </div>
      <ul id="expense-list" class="tx-list"></ul>
    </div>

    <!-- 거래 내역 -->
    <div class="card overflow-hidden !p-0">
      <div class="px-4 pt-4 pb-2 flex items-center justify-between" style="border-bottom:1px solid rgba(0,0,0,.06)">
        <h2 id="tx-list-title" class="text-sm font-bold" style="color:var(--on-surface)"></h2>
        <button onclick="openManual()" class="text-xs font-semibold" style="color:var(--primary)">+ 직접 입력</button>
      </div>
      <ul id="tx-list" class="tx-list">
        <li class="py-12 text-center">
          <p class="text-4xl mb-3">📭</p>
          <p class="text-sm" style="color:var(--on-surface-m)">거래 내역이 없어요</p>
        </li>
      </ul>
    </div>
  </div>
</div>

<!-- ── 하단 바 ── -->
<div id="bottom-bar" class="bottom-bar hidden">
  <button onclick="signOut()" class="btn-primary">로그아웃</button>
</div>

<!-- ── 미확인 내역 수정 모달 ── -->
<div id="modal-unconfirmed" class="modal-overlay hidden" onclick="closeUnconfirmed(event)">
  <div class="modal-sheet">
    <div class="modal-grabber"></div>
    <h3 class="text-base font-extrabold mb-4" style="color:var(--on-surface)">미확인 내역 수정</h3>
    <input type="hidden" id="uc-id">
    <div class="space-y-3">
      <div class="field">
        <label>거래 종류</label>
        <select id="uc-type">
          <option value="1">입금</option>
          <option value="-1">출금</option>
        </select>
      </div>
      <div class="field">
        <label>금액 (원)</label>
        <input id="uc-amount" type="number" min="1" placeholder="금액">
      </div>
      <div class="field">
        <label>상대방</label>
        <input id="uc-counterpart" type="text" placeholder="상대방 이름">
      </div>
      <div class="field">
        <label>거래 일자</label>
        <input id="uc-date" type="date">
      </div>
      <div class="field">
        <label>거래 시각</label>
        <input id="uc-time" type="time">
      </div>
      <button class="btn-primary" onclick="confirmUnconfirmed()">확인 처리</button>
    </div>
  </div>
</div>

<!-- ── 수동 입력 모달 ── -->
<div id="modal-manual" class="modal-overlay hidden" onclick="closeManual(event)">
  <div class="modal-sheet">
    <div class="modal-grabber"></div>
    <h3 class="text-base font-extrabold mb-4" style="color:var(--on-surface)">거래 직접 입력</h3>
    <div class="space-y-3">
      <div class="field">
        <label>거래 종류</label>
        <select id="manual-type">
          <option value="1">입금</option>
          <option value="-1">출금</option>
        </select>
      </div>
      <div class="field">
        <label>금액 (원)</label>
        <input id="manual-amount" type="number" min="1" placeholder="금액">
      </div>
      <div class="field">
        <label>상대방 / 메모</label>
        <input id="manual-counterpart" type="text" placeholder="예: 카페 결제">
      </div>
      <div class="field">
        <label>잔액 (원, 선택)</label>
        <input id="manual-balance" type="number" placeholder="입력 안 하면 자동 계산">
      </div>
      <div class="field">
        <label>거래 일자</label>
        <input id="manual-date" type="date">
      </div>
      <div class="field">
        <label>거래 시각</label>
        <input id="manual-time" type="time">
      </div>
      <button class="btn-primary" onclick="submitManual()">저장</button>
    </div>
  </div>
</div>

<!-- ── 큰지출 입력 모달 ── -->
<div id="modal-expense" class="modal-overlay hidden" onclick="closeExpense(event)">
  <div class="modal-sheet">
    <div class="modal-grabber"></div>
    <h3 class="text-base font-extrabold mb-4" style="color:var(--on-surface)">뜻밖의 큰지출 추가</h3>
    <div class="space-y-3">
      <div class="field">
        <label>금액 (원)</label>
        <input id="expense-amount" type="number" min="1" placeholder="금액">
      </div>
      <div class="field">
        <label>내용</label>
        <input id="expense-desc" type="text" placeholder="예: 차 수리비">
      </div>
      <div class="field">
        <label>지출 일자</label>
        <input id="expense-date" type="date">
      </div>
      <button class="btn-primary" onclick="submitExpense()">저장</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
